services:
  database:
    build:
      context: .
      dockerfile: dockerfile.database
    container_name: database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: hb9hcr_web
      MYSQL_USER: hb9hcr
      MYSQL_PASSWORD: hb9hcr
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

  webserver:
    build:
      context: .
      dockerfile: dockerfile.webserver
    container_name: webserver
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html

  database_admin:
    image: phpmyadmin:latest
    container_name: database_admin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306

volumes:
  db_data: